name: Progresso
on:
  issues:
    types: [opened, closed, reopened, labeled, unlabeled, milestoned, demilestoned]
  workflow_dispatch:
  schedule:
    - cron: "0 11 * * 1"

permissions:
  contents: write
  issues: read

concurrency:
  group: progresso
  cancel-in-progress: true

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const all = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: 'all', per_page: 100 });
            const items = all.filter(i => !i.pull_request);
            const names = i => i.labels.map(l => (typeof l === 'string' ? l : l.name));
            const sp = i => { const l = names(i).find(n => /^sp:\d+$/.test(n)); return l ? Number(l.split(':')[1]) : 0; };
            const bar = p => '█'.repeat(Math.round(p / 5)) + '░'.repeat(20 - Math.round(p / 5));

            const groups = {};
            let total = 0, done = 0;
            for (const i of items.filter(i => !names(i).includes('tipo:bug'))) {
              const g = i.milestone ? i.milestone.title : 'Sem sprint';
              groups[g] ??= { total: 0, done: 0, n: 0, nd: 0 };
              const p = sp(i);
              groups[g].total += p; groups[g].n++;
              total += p;
              if (i.state === 'closed') { groups[g].done += p; groups[g].nd++; done += p; }
            }
            const pct = total ? Math.round((done / total) * 100) : 0;

            const closed = items.filter(i => i.state === 'closed' && !names(i).includes('tipo:bug'));
            const days = closed.map(i => (new Date(i.closed_at) - new Date(i.created_at)) / 86400000);
            const lead = days.length ? (days.reduce((a, b) => a + b, 0) / days.length).toFixed(1) : '–';
            const weekAgo = Date.now() - 7 * 86400000;
            const throughput = closed.filter(i => new Date(i.closed_at) > weekAgo).length;
            const wip = items.filter(i => i.state === 'open' && names(i).includes('status:em-andamento')).length;
            const bugs = items.filter(i => i.state === 'open' && names(i).includes('tipo:bug')).length;
            const date = new Date().toISOString().slice(0, 10);

            const rows = Object.entries(groups).sort().map(([g, v]) => {
              const p = v.total ? Math.round((v.done / v.total) * 100) : 0;
              return `| ${g} | ${v.nd}/${v.n} | ${v.done}/${v.total} | ${p}% |`;
            }).join('\n');

            const block = [
              `**Geral: ${pct}%** \`${bar(pct)}\` (${done} de ${total} pontos)`,
              '',
              '| Sprint | Issues | Pontos | Andamento |',
              '|---|---|---|---|',
              rows,
              '',
              `Lead time médio: ${lead} dias · Entregas nos últimos 7 dias: ${throughput} · Em andamento: ${wip} · Bugs abertos: ${bugs}`,
              '',
              `_Atualizado em ${date}_`
            ].join('\n');

            fs.writeFileSync('docs/PROGRESSO.md', `# Progresso\n\n${block}\n`);
            let readme = fs.readFileSync('README.md', 'utf8');
            readme = readme.replace(/<!-- PROGRESS:START -->[\s\S]*<!-- PROGRESS:END -->/, `<!-- PROGRESS:START -->\n${block}\n<!-- PROGRESS:END -->`);
            readme = readme.replace(/progresso-\d+%25/, `progresso-${pct}%25`);
            fs.writeFileSync('README.md', readme);
      - name: Commit
        run: |
          git config user.name "linkdrive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add README.md docs/PROGRESSO.md
          git diff --cached --quiet || (git commit -m "docs: atualiza progresso [skip ci]" && git push)
