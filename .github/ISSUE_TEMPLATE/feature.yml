name: Funcionalidade
description: Nova funcionalidade ou requisito do backlog
labels: ["tipo:feature"]
body:
  - type: textarea
    id: historia
    attributes:
      label: História
      description: "Como [motorista/passageiro/admin], quero [ação] para [benefício]."
    validations: { required: true }
  - type: textarea
    id: aceite
    attributes:
      label: Critérios de aceite
      value: "- [ ] \n- [ ] "
    validations: { required: true }
  - type: input
    id: ref
    attributes:
      label: Referência (RN/RF)
      placeholder: RN-05
  - type: dropdown
    id: pontos
    attributes:
      label: Estimativa (story points)
      description: "Lembre de aplicar também o label sp:N correspondente."
      options: ["1", "2", "3", "5", "8"]
